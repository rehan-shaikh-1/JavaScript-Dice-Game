<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Dice Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <h1 class="result">Refresh Me</h1>
        <p class="subtitle">Reload the page to roll the dice.</p>
        <section class="players">
            <article class="player-card">
                <h2>Player 1</h2>
                <img class="dice-img" src="./images/dice6.png" alt="Player 1 dice">
            </article>
            <article class="player-card">
                <h2>Player 2</h2>
                <img class="dice-img" src="./images/dice6.png" alt="Player 2 dice">
            </article>
        </section>
    </main>
    <footer>
        <p>Made with Love ❤️</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
